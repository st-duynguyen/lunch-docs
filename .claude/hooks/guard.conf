# guard.conf — AI được tự làm gì, phải hỏi gì. guard.py đọc file này trước mỗi lệnh shell của Claude.
# Mỗi dòng: ASK=<regex> (luôn hỏi người) hoặc ALLOW=<regex> (chạy thẳng). ASK xét trước ALLOW.
# Lệnh không khớp dòng nào: Claude Code hỏi như bình thường.

# Phải hỏi: merge, chuyển PR draft sang ready, PR thường, push main, force push, ghi bình luận lên GitHub
ASK=gh pr merge
ASK=gh pr ready
ASK=gh pr create(?!.*--draft)
ASK=git push\b.*\bmain\b
ASK=git push\b.*(\s-f\b|--force)
ASK=gh (issue|pr) comment
ASK=gh issue create

# Tự làm: commit, push nhánh việc, mở PR draft, chạy test và kiểm tra tài liệu
ALLOW=^git (add|commit|checkout|switch|status|diff|log|pull|fetch)\b
ALLOW=^gh (pr|issue) (view|list|checkout|diff)\b
ALLOW=^gh run (list|view)\b
ALLOW=^git push( -u)? origin feature/
ALLOW=^gh pr create .*--draft
ALLOW=^(python3 -m unittest|npm test|bash (docs/)?scripts/)
